name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default "tools platform-tools" fails: the legacy "tools" package
          # was removed from the SDK repository, so sdkmanager exits 1.
          packages: platform-tools

      - name: Make Gradle wrappers executable
        run: |
          chmod +x android/gradlew spec/reference/gradlew

      - name: Run spec unit tests
        run: cd spec/reference && ./gradlew test --no-daemon

      - name: Run Android unit tests
        run: cd android && ./gradlew test --no-daemon

      - name: Assemble debug and release APKs
        run: cd android && ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Name debug-signed release APK
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)
          mkdir -p android/dist artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "android/dist/openblocker-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "android/dist/openblocker-${VERSION}-debug-signed.apk"
          sha256sum android/dist/*.apk | tee android/dist/SHA256SUMS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: openblocker-apk
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENBLOCKER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Skipping GitHub Release: secret OPENBLOCKER_KEYSTORE_BASE64 is not set."
            echo "Add these repository secrets to publish a signed APK on tag v*:"
            echo "  OPENBLOCKER_KEYSTORE_BASE64"
            echo "  OPENBLOCKER_KEYSTORE_PASSWORD"
            echo "  OPENBLOCKER_KEY_ALIAS"
            echo "  OPENBLOCKER_KEY_PASSWORD"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        if: steps.signing.outputs.available == 'true'
        uses: android-actions/setup-android@v3
        with:
          # The default "tools platform-tools" fails: the legacy "tools" package
          # was removed from the SDK repository, so sdkmanager exits 1.
          packages: platform-tools

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          OPENBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.OPENBLOCKER_KEYSTORE_PASSWORD }}
          OPENBLOCKER_KEY_ALIAS: ${{ secrets.OPENBLOCKER_KEY_ALIAS }}
          OPENBLOCKER_KEY_PASSWORD: ${{ secrets.OPENBLOCKER_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.OPENBLOCKER_KEYSTORE_BASE64 }}
        run: |
          chmod +x android/gradlew android/build-release.sh
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          export OPENBLOCKER_KEYSTORE_PATH="$KEYSTORE"
          android/build-release.sh --release-only

      - name: Attach APK to GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/*.apk
            android/dist/*.sha256
          body_path: RELEASE-NOTES-0.1.0-alpha.md
          generate_release_notes: false
          prerelease: true
